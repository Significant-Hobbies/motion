# XcodeGen spec for the Motion iOS motion controller.
#
# Generate the Xcode project with:
#     brew install xcodegen        # once
#     cd ios && xcodegen generate
#     open Motion.xcodeproj
#
# Then set your Development Team and (optionally) a unique bundle id in the target's
# Signing & Capabilities tab before building to a physical device.

name: Motion

options:
  bundleIdPrefix: com.motion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Modern concurrency checking; the sources are written to be Swift 6 clean.
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Motion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Directory glob: every file under Sources is compiled, so new files (Game/,
      # Recording/ScreenRecorder.swift, Views/GameView.swift) are picked up automatically.
      - path: Sources
      # The bundled web game (self-contained "pure app"). A FOLDER REFERENCE so it
      # ships as a real `webgame/` directory (GameConfig loads webgame/index.html via
      # file://). Regenerate with ./scripts/sync-webgame.sh; GameConfig auto-prefers it.
      - path: Resources/webgame
        type: folder
    info:
      # XcodeGen GENERATES this plist from the properties below on every `xcodegen
      # generate`, so the keys MUST live here (a hand-edited Info.plist would be
      # overwritten). Missing usage strings => hard TCC crash on first camera access.
      path: Sources/Motion/Info.plist
      properties:
        NSCameraUsageDescription: "Motion uses the front camera on-device to turn your body movements into game controls. Camera video never leaves your phone."
        NSPhotoLibraryAddUsageDescription: "Motion saves your gameplay recordings (the game plus your camera) to Photos."
        NSLocalNetworkUsageDescription: "Motion connects to the game running on your computer over your local Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motion.controller
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        # SwiftUI @main App lifecycle — no AppDelegate/SceneDelegate needed.
        ENABLE_PREVIEWS: YES
        # Default signing: Sarthak Agrawal's personal (free) Apple ID team, so the
        # project builds to a device without picking a team each time. Automatic
        # signing lets the free team mint the provisioning profile.
        # NOTE: this is the TEAM ID (the signing cert's OU), not the name-suffix in
        # the cert's common name.
        DEVELOPMENT_TEAM: 8F7LXHTJZR
        CODE_SIGN_STYLE: Automatic
    # System frameworks. AVFoundation + Vision + SwiftUI are weak-implicit via import,
    # but we link them explicitly for clarity. No SPM dependencies are required.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMedia.framework
      # WebKit: hosts the web game in a full-screen WKWebView (v1 in-process JS bridge).
      - sdk: WebKit.framework
      # ReplayKit: v1 screen capture — records the game webview + camera inset as ONE mp4.
      - sdk: ReplayKit.framework
      # Photos: saving the recorded (game + camera) screen video to the library.
      - sdk: Photos.framework
