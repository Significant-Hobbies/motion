name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: motion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code health (TypeScript + Swift metrics)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Qualify real relay in a network-isolated namespace
        run: |
          relay_node_executable="$(command -v node)"
          sudo unshare --net -- sh -c 'ip link set lo up; exec "$@"' \
            motion-relay "$relay_node_executable" scripts/qualify-relay.mjs

  ios:
    name: iOS build and Swift quality
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install native quality tools
        run: brew install xcodegen periphery
      - name: Generate CocoaPods workspace
        working-directory: ios
        run: |
          xcodegen generate
          pod install --deployment
      - name: Build iOS app
        run: >-
          xcodebuild
          -workspace ios/Motion.xcworkspace
          -scheme Motion
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/motion-derived"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify shared UI resources in the built app
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          app = Path(os.environ["RUNNER_TEMP"]) / "motion-derived/Build/Products/Debug-iphonesimulator/Motion.app"
          bundle = app / "SaaSMakerUI_SaaSMakerUI.bundle"
          assert app.is_dir(), f"Missing built app: {app}"
          assert bundle.is_dir(), f"Missing UI resources in app: {bundle}"
          fonts = sorted(p.name for p in bundle.rglob("*.ttf"))
          required = {"Figtree.ttf", "Geist.ttf", "Newsreader.ttf", "GeistMono.ttf", "InstrumentSerif-Regular.ttf", "Fraunces.ttf"}
          assert required <= set(fonts), f"Missing bundled fonts: {required - set(fonts)}"
          evidence = Path(os.environ["RUNNER_TEMP"]) / "compact-button-evidence"
          evidence.mkdir(exist_ok=True)
          (evidence / "app-resources.json").write_text(json.dumps({"app": app.name, "bundle": bundle.name, "fonts": fonts, "libraryRevision": "580a30e6dac470bbf45c9c4661c76169715cf538"}, indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: motion-compact-button-app-resources
          path: ${{ runner.temp }}/compact-button-evidence/
          if-no-files-found: error
      - name: Check Swift quality ratchets
        env:
          MOTION_INDEX_STORE: ${{ runner.temp }}/motion-derived/Index.noindex/DataStore
        run: pnpm quality:swift
      - name: Run iOS unit tests
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in sorted(devices.items(), reverse=True)
                     if ".iOS-" in runtime for d in items if ".iPhone-" in d["deviceTypeIdentifier"]))
          ')"
          xcodebuild \
            -workspace ios/Motion.xcworkspace \
            -scheme Motion \
            -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/motion-derived" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/motion-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Capture native coverage evidence
        run: |
          mkdir -p "$RUNNER_TEMP/motion-coverage"
          xcrun xccov view --report --json "$RUNNER_TEMP/motion-tests.xcresult" \
            > "$RUNNER_TEMP/motion-coverage/coverage.json"
          xcrun xccov view --report "$RUNNER_TEMP/motion-tests.xcresult" \
            > "$RUNNER_TEMP/motion-coverage/coverage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: motion-native-coverage
          path: ${{ runner.temp }}/motion-coverage/
          if-no-files-found: error
